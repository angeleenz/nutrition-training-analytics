<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nutrition & Training{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="font-bold text-xl hover:text-blue-100">NutritionAnalytics</a>
            <div class="space-x-4 flex items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="hover:text-blue-200">Dashboard</a>
                    <a href="{% url 'nutrition-list' %}" class="hover:text-blue-200">Nutrition</a>
                    <a href="{% url 'training-list' %}" class="hover:text-blue-200">Training</a>
                    <span class="text-blue-300 text-sm">|</span>
                    <span class="text-sm font-semibold">{{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="hover:text-red-200 text-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:text-blue-200">Login</a>
                    <a href="{% url 'signup' %}" class="bg-white text-blue-600 px-3 py-1 rounded hover:bg-gray-100 transition">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 Nutrition Training Analytics. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
