{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-4 text-red-600">Confirm Deletion</h2>
    
    <p class="mb-6 text-gray-700">Are you sure you want to delete this {{ type }} for <strong>{{ object.date }}</strong>?</p>
    
    <div class="bg-gray-50 p-4 rounded mb-6 text-sm text-gray-500">
        {{ object }}
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-3">
            <a href="javascript:history.back()" class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 shadow font-medium">Delete</button>
        </div>
    </form>
</div>
{% endblock %}
